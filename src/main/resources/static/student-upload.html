<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Request | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        dark: {
                            900: '#0a0a0f',
                            800: '#12121a'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-navbar {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }
        .fintech-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-premium {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-premium:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col relative overflow-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- Animated Glowing Background Orbs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[10%] left-[10%] w-[500px] h-[500px] bg-brand-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-blob"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[400px] h-[400px] bg-purple-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-blob animation-delay-2000"></div>
    </div>

    <!-- Header -->
    <header class="glass-navbar fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer hover:scale-105 transition-transform duration-300" onclick="window.location.href='studentdashboard.html'">
                    <span class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-brand-600 via-purple-600 to-brand-600 bg-[length:200%_auto] animate-[gradient_3s_ease-in-out_infinite] tracking-tighter">
                        FeesPortal.
                    </span>
                </div>
                
                <nav class="flex items-center gap-6">
                    <button onclick="window.location.href='studentdashboard.html'" class="px-6 py-2.5 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-full transition-all duration-300">
                        Back to Dashboard
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-16 relative z-10 opacity-0 animate-fade-in-up">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-dark-900 tracking-tighter">New Fee Structure Request</h1>
            <p class="text-gray-500 font-medium mt-2 text-lg">Submit your details accurately to avoid delays.</p>
        </div>

        <div class="fintech-card rounded-[2rem] p-10">
            <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Full Name</label>
                        <input type="text" id="name" name="name" required readonly class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none font-semibold cursor-not-allowed bg-gray-100/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Roll Number</label>
                        <input type="text" id="rollno" name="rollno" required readonly class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none font-semibold cursor-not-allowed bg-gray-100/50">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Email Address</label>
                        <input type="email" id="email" name="email" required readonly class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none font-semibold cursor-not-allowed bg-gray-100/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Course</label>
                        <select id="course" name="course" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none cursor-pointer font-semibold appearance-none">
                            <option value="">Select Course</option>
                            <option value="B.E">B.E</option>
                            <option value="B.Tech">B.Tech</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Department</label>
                        <select id="department" name="department" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none cursor-pointer font-semibold appearance-none">
                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Year of Study</label>
                        <select id="year" name="year" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none cursor-pointer font-semibold appearance-none">
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Reason for Request</label>
                    <textarea id="reason" name="reason" required placeholder="Provide a brief explanation..." rows="3" class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 placeholder-gray-400 outline-none font-semibold resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Supporting Document</label>
                    <div class="relative">
                        <input type="file" id="file" name="file" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="input-premium w-full px-5 py-8 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-gray-300">
                            <svg class="w-8 h-8 text-brand-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <span class="font-bold text-gray-500 text-sm" id="fileNameDisplay">Click to browse or drag and drop</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="group relative w-full py-4 mt-8 bg-dark-900 text-white font-bold rounded-2xl overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.2)] hover:shadow-[0_8px_30px_rgba(37,99,235,0.4)] transition-all duration-300 hover:-translate-y-1">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-brand-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <span class="relative z-10">Submit Request</span>
                </button>
                <p id="message" class="text-center font-bold mt-4 min-h-[24px] text-sm"></p>
            </form>
        </div>

    </main>

    <script src="fetchWithAuth.js"></script>
    <script src="student-upload.js"></script>
    <script>
        document.getElementById('file').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'Click to browse or drag and drop';
            document.getElementById('fileNameDisplay').textContent = fileName;
            document.getElementById('fileNameDisplay').classList.add('text-brand-600');
        });
    </script>
</body>
</html>
