<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Student Document | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-x-hidden py-12 px-4">
    
    <!-- Ambient Background -->
    <div class="fixed top-[-100px] left-[-100px] w-[500px] h-[500px] bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-100px] right-[-100px] w-[500px] h-[500px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>

    <div class="w-full max-w-2xl relative z-10">
        
        <div class="bg-white/90 backdrop-blur-xl border border-gray-100 rounded-3xl shadow-2xl p-10">
            <h1 class="text-3xl font-extrabold text-center mb-8 text-gray-900 tracking-tight">Upload Student Document</h1>

            <form id="studentForm" class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Roll No</label>
                        <input type="text" id="rollno" name="rollno" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">ID</label>
                        <input type="text" id="id" name="id" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
                        <input type="text" id="name" name="name" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
                        <input type="text" id="department" name="department" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Year</label>
                        <input type="text" id="year" name="year" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Course</label>
                        <input type="text" id="course" name="course" readonly class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 outline-none cursor-not-allowed font-medium">
                    </div>
                </div>

                <div>
                    <label for="reason" class="block text-sm font-semibold text-gray-700 mb-2">Reason</label>
                    <textarea id="reason" name="reason" rows="4" placeholder="Enter your reason here..." class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium shadow-sm resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Upload File</label>
                    <input type="file" id="file" name="file" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium shadow-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 py-3.5 bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
                        Submit Request
                    </button>
                    <button type="button" onclick="window.location.href='studentdashboard.html'" class="flex-1 py-3.5 bg-white border border-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-50 transition-all shadow-sm">
                        Cancel
                    </button>
                </div>

            </form>
        </div>

    </div>

    <script src="fetchWithAuth.js"></script>
    <script src="student-upload.js"></script>
</body>
</html>
