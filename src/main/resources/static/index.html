<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Ambient Background -->
    <div class="absolute top-[-150px] left-[-150px] w-[500px] h-[500px] bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-150px] right-[-150px] w-[500px] h-[500px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 tracking-tight">
                        Fees Portal
                    </span>
                </div>
                <!-- Nav -->
                <nav class="flex items-center gap-4">
                    <a href="#" class="text-gray-600 hover:text-gray-900 font-medium px-3 py-2 rounded-md transition-colors">Home</a>
                    <a href="#" class="text-gray-600 hover:text-gray-900 font-medium px-3 py-2 rounded-md transition-colors">About</a>
                    <a href="login.html" class="bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
                        Login
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-center items-center relative z-10 px-4 sm:px-6 lg:px-8 py-16">
        
        <!-- Hero Section -->
        <div class="text-center max-w-3xl mx-auto mb-16">
            <h1 class="text-5xl sm:text-6xl font-extrabold text-gray-900 tracking-tight mb-6 leading-tight">
                Streamline Your <br/>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">Fee Structures</span>
            </h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">
                A highly secure, beautifully designed portal for students to request fee structures and for admins to seamlessly manage them.
            </p>
        </div>

        <!-- Stats Section -->
        <div class="w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all text-center">
                <div class="text-4xl font-extrabold text-brand-600 mb-2">10k+</div>
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wider">Students</div>
            </div>
            
            <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all text-center">
                <div class="text-4xl font-extrabold text-brand-600 mb-2">99%</div>
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wider">Approval Rate</div>
            </div>
            
            <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all text-center">
                <div class="text-4xl font-extrabold text-brand-600 mb-2">24/7</div>
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wider">Support</div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-8 relative z-10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 font-medium">&copy; 2026 Fees Portal. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
