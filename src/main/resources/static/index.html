<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Portal | Ultra-Premium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        dark: {
                            900: '#0a0a0f',
                            800: '#12121a',
                            700: '#1c1c24'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in-up-delay-1': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards',
                        'fade-in-up-delay-2': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ultra Premium Glass effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- Animated Glowing Background Orbs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brand-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[400px] h-[400px] bg-purple-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[600px] h-[600px] bg-pink-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 transition-all duration-300 bg-white/60 backdrop-blur-xl border-b border-white/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center cursor-pointer hover:scale-105 transition-transform duration-300">
                    <span class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-brand-600 via-purple-600 to-brand-600 bg-[length:200%_auto] animate-[gradient_3s_ease-in-out_infinite] tracking-tighter">
                        FeesPortal.
                    </span>
                </div>
                <!-- Nav -->
                <nav class="flex items-center gap-6">
                    <a href="login.html" class="group relative px-7 py-3 font-bold text-white rounded-full overflow-hidden bg-dark-900 shadow-[0_0_40px_-10px_rgba(0,0,0,0.5)] hover:shadow-[0_0_40px_-10px_rgba(37,99,235,0.6)] transition-all duration-300 hover:-translate-y-1">
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-brand-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <span class="relative z-10 flex items-center gap-2">
                            Enter Portal
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-center items-center relative z-10 px-4 sm:px-6 lg:px-8 pt-32 pb-16">
        
        <!-- Hero Section -->
        <div class="text-center max-w-4xl mx-auto mb-20">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/80 backdrop-blur-md border border-gray-200 text-sm font-semibold text-brand-600 mb-8 opacity-0 animate-fade-in-up shadow-sm">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-500"></span>
                </span>
                Next-Gen Fee Management
            </div>
            
            <h1 class="text-6xl sm:text-7xl lg:text-8xl font-black text-dark-900 tracking-tighter mb-8 leading-[1.1] opacity-0 animate-fade-in-up-delay-1">
                Manage requests with<br/>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-brand-600 via-purple-600 to-pink-500 leading-tight pb-2">
                    absolute precision.
                </span>
            </h1>
            
            <p class="text-xl sm:text-2xl text-gray-500 max-w-2xl mx-auto font-medium opacity-0 animate-fade-in-up-delay-2 leading-relaxed">
                An ultra-premium, highly secure platform designed to seamlessly connect students and administrators.
            </p>
        </div>

        <!-- Stats Section -->
        <div class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 opacity-0 animate-fade-in-up-delay-2">
            
            <div class="glass-panel rounded-3xl p-10 text-center transform transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl group cursor-default relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-brand-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div class="relative z-10">
                    <div class="text-6xl font-black text-dark-900 mb-3 tracking-tighter group-hover:text-brand-600 transition-colors duration-300">10k+</div>
                    <div class="text-sm font-bold text-gray-400 uppercase tracking-widest">Active Students</div>
                </div>
            </div>
            
            <div class="glass-panel rounded-3xl p-10 text-center transform transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl group cursor-default relative overflow-hidden mt-4 md:mt-0">
                <div class="absolute inset-0 bg-gradient-to-br from-purple-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div class="relative z-10">
                    <div class="text-6xl font-black text-dark-900 mb-3 tracking-tighter group-hover:text-purple-600 transition-colors duration-300">99%</div>
                    <div class="text-sm font-bold text-gray-400 uppercase tracking-widest">Approval Rate</div>
                </div>
            </div>
            
            <div class="glass-panel rounded-3xl p-10 text-center transform transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl group cursor-default relative overflow-hidden mt-8 md:mt-0">
                <div class="absolute inset-0 bg-gradient-to-br from-pink-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div class="relative z-10">
                    <div class="text-6xl font-black text-dark-900 mb-3 tracking-tighter group-hover:text-pink-600 transition-colors duration-300">&lt;1s</div>
                    <div class="text-sm font-bold text-gray-400 uppercase tracking-widest">Processing Time</div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
