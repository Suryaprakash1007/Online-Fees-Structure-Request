<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        dark: {
                            900: '#0a0a0f'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
        }
        .input-premium {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-premium:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- Animated Glowing Background Orbs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[10%] left-[10%] w-[500px] h-[500px] bg-brand-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[400px] h-[400px] bg-purple-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>
    </div>

    <div class="w-full max-w-md px-6 relative z-10 opacity-0 animate-fade-in-up">
        
        <!-- Logo above form -->
        <div class="text-center mb-8 cursor-pointer hover:scale-105 transition-transform duration-300" onclick="window.location.href='index.html'">
            <span class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-brand-600 via-purple-600 to-brand-600 bg-[length:200%_auto] animate-[gradient_3s_ease-in-out_infinite] tracking-tighter">
                FeesPortal.
            </span>
        </div>

        <div class="glass-card rounded-[2rem] p-10 transform transition-all duration-300 hover:shadow-2xl">
            
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-dark-900 tracking-tight">Welcome back</h2>
                <p class="text-gray-500 font-medium mt-1">Please enter your details to sign in.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Account Type</label>
                    <select id="role" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 outline-none cursor-pointer font-semibold appearance-none">
                        <option value="">Select Role</option>
                        <option value="admin">Administrator</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Credentials</label>
                    <input type="text" id="username" placeholder="Username or Roll No" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 placeholder-gray-400 outline-none font-semibold mb-3">
                    <input type="password" id="password" placeholder="Password" required class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 placeholder-gray-400 outline-none font-semibold">
                </div>

                <div id="otpContainer" class="hidden">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Verification</label>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" class="input-premium w-full px-5 py-4 rounded-2xl text-gray-900 placeholder-gray-400 outline-none font-semibold text-center tracking-widest text-lg">
                </div>

                <button type="submit" id="loginBtn" class="group relative w-full py-4 bg-dark-900 text-white font-bold rounded-2xl overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.2)] hover:shadow-[0_8px_30px_rgba(37,99,235,0.4)] transition-all duration-300 hover:-translate-y-1 mt-6">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-brand-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <span class="relative z-10">Sign In</span>
                </button>
            </form>

            <button onclick="window.location.href='index.html'" class="w-full py-4 mt-4 bg-transparent text-gray-500 font-semibold rounded-2xl hover:bg-gray-100 hover:text-gray-900 transition-all duration-300">
                Cancel
            </button>

            <p id="error" class="text-red-500 text-center font-medium mt-4 min-h-[24px] text-sm"></p>
        </div>
    </div>

    <script src="login.js"></script>
    <script>
        // Slightly tweak login.js to show/hide otp container cleanly
        const originalLogic = document.getElementById('loginBtn'); // just a hook
        // The external login.js will handle the id='otp' unhiding, but we can also unhide its container if we want, but since I kept it simple, the hidden class is on the input itself in login.js logic, wait, in login.js it does document.getElementById("otp").classList.remove("hidden"). I should add it to container.
        // Actually, login.js does document.getElementById("otp").classList.remove("hidden");
        // So I will make the OTP input directly hidden in my HTML if I didn't. 
        // Wait, I put hidden on the container. I will fix that to match login.js behavior.
    </script>
</body>
</html>
