<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Ambient Background -->
    <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-100px] right-[-100px] w-[500px] h-[500px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>

    <div class="w-full max-w-md px-6 relative z-10">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-gray-100 p-10 transform transition-all">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 tracking-tight mb-2">
                    Fees Portal
                </h1>
                <p class="text-gray-500 font-medium">Sign in to continue</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <select id="role" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all cursor-pointer font-medium">
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div>
                    <input type="text" id="username" placeholder="Username / Roll No" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium">
                </div>

                <div>
                    <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium">
                </div>

                <div>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" class="hidden w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all font-medium">
                </div>

                <button type="submit" id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all mt-2">
                    Login
                </button>
            </form>

            <button id="back-btn" class="w-full py-3 mt-4 bg-transparent border border-gray-200 text-gray-600 font-semibold rounded-xl hover:bg-gray-50 hover:text-gray-900 transition-all">
                Back to Home
            </button>

            <p id="error" class="text-red-500 text-center font-medium mt-4 min-h-[24px]"></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
