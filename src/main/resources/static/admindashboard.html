<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-white/90 backdrop-blur-xl border-r border-gray-200 shadow-sm flex flex-col h-screen fixed top-0 left-0 z-20 transition-all">
        <div class="p-6">
            <h2 class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 tracking-tight text-center">
                Fees Portal
            </h2>
        </div>
        
        <nav class="flex-1 px-4 py-4 space-y-2 overflow-y-auto">
            <a href="admindashboard.html" class="flex items-center gap-3 px-4 py-3 bg-brand-50 text-brand-700 rounded-xl font-semibold transition-all">
                📊 Dashboard
            </a>
            <a href="admin-pending.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-xl font-medium transition-all">
                ⏳ Pending Requests
            </a>
            <a href="approved.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-xl font-medium transition-all">
                ✅ Approved Requests
            </a>
            <a href="rejected.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-xl font-medium transition-all">
                ❌ Rejected Requests
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl font-semibold transition-all">
                🚪 Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 h-screen overflow-y-auto relative">
        <!-- Ambient Background -->
        <div class="fixed top-[-100px] right-[-100px] w-[500px] h-[500px] bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 z-0 pointer-events-none"></div>

        <div class="p-10 relative z-10 max-w-7xl mx-auto">
            
            <header class="mb-10">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Dashboard Overview</h1>
                <p class="text-gray-500 font-medium mt-1">Welcome back, Admin. Here's what's happening today.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                
                <!-- Stat Card -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Total Students</h3>
                    <p class="text-3xl font-extrabold text-gray-900" id="totalStudentsCount">...</p>
                </div>

                <!-- Stat Card -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                    <h3 class="text-xs font-bold text-yellow-600 uppercase tracking-wider mb-2">Pending Requests</h3>
                    <p class="text-3xl font-extrabold text-gray-900" id="pendingRequestsCount">...</p>
                </div>

                <!-- Stat Card -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                    <h3 class="text-xs font-bold text-green-600 uppercase tracking-wider mb-2">Approved Requests</h3>
                    <p class="text-3xl font-extrabold text-gray-900" id="approvedRequestsCount">...</p>
                </div>

                <!-- Stat Card -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                    <h3 class="text-xs font-bold text-red-600 uppercase tracking-wider mb-2">Rejected Requests</h3>
                    <p class="text-3xl font-extrabold text-gray-900" id="rejectedRequestsCount">...</p>
                </div>

            </div>
            
        </div>
    </main>

    <script src="fetchWithAuth.js"></script>
    <script src="admindashboard.js"></script>
</body>
</html>
