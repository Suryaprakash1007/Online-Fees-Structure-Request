<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Fees Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        dark: {
                            900: '#0a0a0f',
                            800: '#12121a'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 10px 0 30px -10px rgba(0,0,0,0.05);
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex overflow-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- Animated Glowing Background Orbs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[10%] left-[20%] w-[500px] h-[500px] bg-brand-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[400px] h-[400px] bg-purple-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 glass-sidebar flex flex-col h-screen fixed top-0 left-0 z-20 transition-all">
        <div class="p-8 cursor-pointer hover:scale-105 transition-transform duration-300" onclick="window.location.href='admindashboard.html'">
            <h2 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-brand-600 via-purple-600 to-brand-600 bg-[length:200%_auto] animate-[gradient_3s_ease-in-out_infinite] tracking-tighter text-center">
                FeesPortal.
            </h2>
        </div>
        
        <nav class="flex-1 px-5 py-4 space-y-3 overflow-y-auto">
            <a href="admindashboard.html" class="flex items-center gap-3 px-5 py-4 bg-white text-dark-900 rounded-2xl font-bold shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-gray-100 transition-all hover:scale-105">
                <span class="text-brand-600 text-xl">📊</span> Overview
            </a>
            <a href="admin-pending.html" class="flex items-center gap-3 px-5 py-4 text-gray-500 hover:bg-white hover:text-dark-900 rounded-2xl font-semibold transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-transparent hover:border-gray-100 group">
                <span class="text-xl group-hover:scale-110 transition-transform">⏳</span> Pending
            </a>
            <a href="approved.html" class="flex items-center gap-3 px-5 py-4 text-gray-500 hover:bg-white hover:text-dark-900 rounded-2xl font-semibold transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-transparent hover:border-gray-100 group">
                <span class="text-xl group-hover:scale-110 transition-transform">✅</span> Approved
            </a>
            <a href="rejected.html" class="flex items-center gap-3 px-5 py-4 text-gray-500 hover:bg-white hover:text-dark-900 rounded-2xl font-semibold transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-transparent hover:border-gray-100 group">
                <span class="text-xl group-hover:scale-110 transition-transform">❌</span> Rejected
            </a>
        </nav>

        <div class="p-5 border-t border-gray-100/50">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-5 py-4 bg-red-50 text-red-600 hover:bg-red-500 hover:text-white rounded-2xl font-bold transition-all duration-300">
                🚪 Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 h-screen overflow-y-auto relative z-10">
        <div class="p-12 max-w-7xl mx-auto opacity-0 animate-fade-in-up">
            
            <header class="mb-12">
                <h1 class="text-4xl font-black text-dark-900 tracking-tighter">Command Center</h1>
                <p class="text-gray-500 font-medium mt-2 text-lg">Real-time statistics and overview.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                
                <div class="stat-card rounded-3xl p-8 group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-600 text-2xl group-hover:scale-110 transition-transform">👥</div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Students</h3>
                    </div>
                    <p class="text-5xl font-black text-dark-900 tracking-tighter group-hover:text-blue-600 transition-colors" id="totalStudentsCount">0</p>
                </div>

                <div class="stat-card rounded-3xl p-8 group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-yellow-50 flex items-center justify-center text-yellow-600 text-2xl group-hover:scale-110 transition-transform">⏳</div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Pending</h3>
                    </div>
                    <p class="text-5xl font-black text-dark-900 tracking-tighter group-hover:text-yellow-600 transition-colors" id="pendingRequestsCount">0</p>
                </div>

                <div class="stat-card rounded-3xl p-8 group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-green-50 flex items-center justify-center text-green-600 text-2xl group-hover:scale-110 transition-transform">✅</div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Approved</h3>
                    </div>
                    <p class="text-5xl font-black text-dark-900 tracking-tighter group-hover:text-green-600 transition-colors" id="approvedRequestsCount">0</p>
                </div>

                <div class="stat-card rounded-3xl p-8 group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center text-red-600 text-2xl group-hover:scale-110 transition-transform">❌</div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Rejected</h3>
                    </div>
                    <p class="text-5xl font-black text-dark-900 tracking-tighter group-hover:text-red-600 transition-colors" id="rejectedRequestsCount">0</p>
                </div>

            </div>
            
        </div>
    </main>

    <script src="fetchWithAuth.js"></script>
    <script src="admindashboard.js"></script>
</body>
</html>
